<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Rise & Arcade 기록지</title>

<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>

<body>

<div class="container">

    <!-- 프로필: 원(Total Pump Ability, 칭호 등급 색 채움) + 대표 칭호 + 이름 -->
    <div id="profileBox" class="profile-card">
        <div id="profileAvatar" class="profile-avatar">
            <span id="profileAvatarValue">0.00</span>
        </div>
        <div class="profile-info">
            <div id="profileTitleText" class="profile-title-bar" onclick="openTitlePanel()"></div>
            <div id="profileNameText" class="profile-name-bar" onclick="editProfileName()"></div>
        </div>
    </div>


    <!-- 게임 선택 -->
    <div class="game-select">
        <button data-game="rise" onclick="changeGame('rise')">Rise</button>
        <button data-game="arcade" onclick="changeGame('arcade')">Arcade</button>
    </div>

    <!-- 헤더 -->
    <div class="header">
        <h2 id="gameTitle" onclick="handleTitleClick()">🎮 Rise 기록지</h2>
        <button onclick="openRegister()">+ 곡 등록</button>
    </div>

    <div class="util-menu">
        <button onclick="openRatingPanel()">🏆 Phoenix Pump Ability</button>
        <button onclick="openTitlePanel()">🎖 칭호</button>
    </div>

    <div id="dashboard"></div>

    <button onclick="openNearPerfectPanel()" id="nearPerfectBtn">
        🔥 올퍼 근접곡 보기
    </button>

    <button onclick="toggleStats()" id="toggleStatsBtn">
        📊 통계 펼치기
    </button>

    <div id="levelGraph" style="display:none;"></div>

    <!-- 모드 (게임별로 자동 렌더링) -->
    <div id="modeBox" class="mode"></div>

    <!-- 레벨 -->
    <div id="levelBox" class="levels"></div>

    <!-- 곡 메뉴 -->
    <div id="songToolbar" style="display:none;">

        <input
            id="searchBox"
            placeholder="곡 검색"
            oninput="renderSongs()"
        >

        <button
            id="toggleBtn"
            onclick="toggleUncleared()"
        >
            100만점 제외 보기
        </button>

        <div id="randomDropdown" class="random-dropdown">
            <button onclick="toggleRandomMenu(event)">
                🎲 랜덤 ▼
            </button>
            <div id="randomMenu" class="random-menu" style="display:none;">
                <button onclick="runRandom('all')">전체</button>
                <button onclick="runRandom('uncleared')">올퍼 제외</button>
                <button onclick="runRandom('unrecorded')">미등록</button>
            </div>
        </div>

        <button onclick="goBack()">
            뒤로가기
        </button>

    </div>

    <hr>

    <!-- 곡 리스트 -->
    <div id="levelStats" style="margin:10px 0; font-weight:bold;"></div>
    <div id="songList"></div>

    <hr>

    <!-- 백업 -->
    <div id="backupArea">

    <button
        onclick="exportJSON()"
        class="backup-btn"
    >
        백업
    </button>

    <button
        onclick="document.getElementById('importFile').click()"
        class="import-btn"
    >
        불러오기
    </button>

    <input
        id="importFile"
        type="file"
        accept=".json"
        onchange="importJSON(event)"
        style="display:none;"
    >

</div>

</div>

<!-- 등록/수정 모달 -->
<div id="registerModal" class="modal">

    <div class="modal-box">

        <h3>곡 등록</h3>

        <!-- 신규 등록 -->
        <input
            id="title"
            placeholder="곡 제목"
        >

        <input
            id="riseSingleLevel"
            placeholder="Rise 싱글 Lv (예: 18 20)"
        >

        <input
            id="riseDoubleLevel"
            placeholder="Rise 하프더블 Lv (예: 19 22)"
        >

        <input
            id="arcadeSingleLevel"
            placeholder="Arcade 싱글 Lv (예: 18 20)"
        >

        <input
            id="arcadeDoubleLevel"
            placeholder="Arcade 더블 Lv (예: 19 22)"
        >

        <input
            type="file"
            id="img"
        >

        <hr>

        <!-- 수정/삭제 -->
        <h3>곡 수정 / 삭제</h3>

        <input
            id="editSearch"
            placeholder="곡 이름 검색"
        >

        <button onclick="findSongForEdit()">
            곡 찾기
        </button>

        <div
            id="editArea"
            style="display:none;"
        >

            <input
                id="editTitle"
                placeholder="곡 제목"
            >

            <input
                id="editRiseSingle"
                placeholder="Rise 싱글 Lv"
            >

            <input
                id="editRiseDouble"
                placeholder="Rise 하프더블 Lv"
            >

            <input
                id="editArcadeSingle"
                placeholder="Arcade 싱글 Lv"
            >

            <input
                id="editArcadeDouble"
                placeholder="Arcade 더블 Lv"
            >

            <img id="editPreview" style="display:none;">

            <input
                type="file"
                id="editImg"
            >

            <div class="modal-btns">

                <button onclick="updateSong()">
                    수정
                </button>

                <button onclick="deleteSong()">
                    삭제
                </button>

            </div>

        </div>

        <hr>

        <div class="modal-btns">

            <button onclick="addSong()">
                등록
            </button>

            <button onclick="closeRegister()">
                닫기
            </button>

        </div>

    </div>

</div>

<!-- 올퍼 근접곡 패널 -->
<div id="nearPerfectModal" class="modal">

    <div class="modal-box">

        <div id="nearPerfectContent"></div>

        <hr>

        <div class="modal-btns">
            <button onclick="closeNearPerfectPanel()">
                닫기
            </button>
        </div>

    </div>

</div>

<!-- 개발자 패널 (제목 5번 클릭 시 표시) -->
<div id="devModal" class="modal">

    <div class="modal-box">

        <h3>🛠 개발자 패널</h3>

        <p style="font-size:13px; color:#aaa; line-height:1.5;">
            배포용 곡 목록은 이미지와 개인 점수를 제외하고
            곡 제목 + 난이도만 담아서 내보냅니다.
        </p>

        <button onclick="exportSongListOnly()" style="width:100%;">
            📦 배포용 곡 목록 내보내기 (이미지/점수 제외)
        </button>

        <hr>

        <p style="font-size:13px; color:#e74c3c; line-height:1.5;">
            아래는 모든 게임의 점수 기록을 전부 삭제합니다.
            (곡 목록/난이도는 유지됩니다) 되돌릴 수 없으니
            확인 문구를 정확히 입력해야 실행됩니다.
        </p>

        <input
            id="devConfirmInput"
            placeholder='확인을 위해 "삭제" 입력'
        >

        <button onclick="resetAllRecords()" style="width:100%; background:#c0392b;">
            🗑 전체 점수 기록 삭제
        </button>

        <hr>

        <div class="modal-btns">
            <button onclick="closeDevPanel()">
                닫기
            </button>
        </div>

    </div>

</div>

<!-- Phoenix Pump Ability 패널 -->
<div id="ratingModal" class="modal" onclick="closeModalOnBackdrop(event, closeRatingPanel)">

    <div class="modal-box">

        <div id="pumpAbilityContent"></div>

        <hr>

        <div class="modal-btns">
            <button onclick="closeRatingPanel()">
                닫기
            </button>
        </div>

    </div>

</div>

<!-- 칭호 패널 -->
<div id="titleModal" class="modal" onclick="closeModalOnBackdrop(event, closeTitlePanel)">

    <div class="modal-box">

        <div id="titleContent"></div>

        <hr>

        <div class="modal-btns">
            <button onclick="closeTitlePanel()">
                닫기
            </button>
        </div>

    </div>

</div>

<!-- 칭호 획득 토스트 -->
<div id="titleToast" class="title-toast"></div>

</body>
</html>
